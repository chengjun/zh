<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Philosophers · SVG 描边动画导航（单线版）</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #fff; }

  .nju-svg-container {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 0;
    position: relative;
    --ink: #aa43ee;           /* SVG 线条默认颜色 */
    --lw: 2.8;                /* 描边宽度（SVG 用户单位），可调 */
  }
  .nju-svg {
    width: min(46%, 540px);
    pointer-events: none;
    transition: transform .15s ease-out;
  }

  /* ---------- 描边绘制动画（单线中心线，自上而下） ---------- */
  .cls-1 {
    fill: none;
    stroke: var(--ink);
    stroke-width: var(--lw);
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: var(--l);
    stroke-dashoffset: var(--l);
    animation: draw 1.8s ease forwards var(--d);
    transition: stroke .3s;
  }
  @keyframes draw {
    from { stroke-dashoffset: var(--l); opacity: 1; }
    to   { stroke-dashoffset: 0; opacity: 1; }
  }
  .dotp {
    fill: var(--ink);
    stroke: none;
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
    animation: pop .45s ease forwards var(--d);
    transition: fill .3s;
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(.2); }
    70%  { opacity: 1; transform: scale(1.25); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* ---------- 导航项 ---------- */
  .nju-nav-item {
    position: absolute;
    padding: .8rem 1.5rem;
    background: rgba(255,255,255,.9);
    border: 2px solid;
    border-radius: 4px;
    cursor: pointer;
    list-style: none;
    transition: all .3s ease;
    z-index: 10;
    font-size: 1.1rem;
    letter-spacing: .2em;
  }
  .nav-item-1 { top: 14%; left: 16%; }
  .nav-item-2 { top: 14%; right: 16%; }
  .nav-item-3 { top: 47%; left: 8%; }
  .nav-item-4 { top: 47%; right: 8%; }
  .nav-item-5 { bottom: 14%; left: 16%; }
  .nav-item-6 { bottom: 14%; right: 16%; }
  .nju-nav-item a { color: inherit; text-decoration: none; }
  .nju-nav-item:hover {
    transform: translateY(-3px);
    box-shadow: 0 4px 12px rgba(0,0,0,.12);
  }

  /* ---------- 静态模式 / 减少动态 ---------- */
  .done .cls-1, .no-anim .cls-1 { animation: none !important; stroke-dashoffset: 0 !important; }
  .done .dotp,  .no-anim .dotp  { animation: none !important; opacity: 1 !important; }
  @media (prefers-reduced-motion: reduce) {
    .cls-1, .dotp { animation: none !important; stroke-dashoffset: 0 !important; opacity: 1 !important; }
  }

  /* ---------- 响应式 ---------- */
  .nju-nav-mobile { display: contents; }
  @media (max-width: 760px) {
    .nju-svg { width: 80%; }
    .nju-nav-item { position: relative; top:auto; left:auto; right:auto; bottom:auto; margin:.4rem; }
    .nju-svg-container { flex-direction: column; }
    .nju-nav-mobile { display: flex; flex-wrap: wrap; justify-content: center; margin-top: 1.5rem; }
  }
</style>
</head>

<script>
// 1) 导航悬停 → SVG 线条整体变色
const container = document.getElementById('nju-container');
const items = document.querySelectorAll('.nju-nav-item');
const defaultColor = getComputedStyle(container).getPropertyValue('--ink') || '#aa43ee';
items.forEach(item => {
  item.addEventListener('mouseenter', () => container.style.setProperty('--ink', getComputedStyle(item).color));
  item.addEventListener('mouseleave', () => container.style.setProperty('--ink', defaultColor.trim()));
});

// 2) 简易视差：鼠标移动时 SVG 轻微位移
const svg = document.querySelector('.nju-svg');
container.addEventListener('mousemove', (e) => {
  const x = (e.clientX - container.offsetLeft - container.offsetWidth / 2) * 0.05;
  const y = (e.clientY - container.offsetTop  - container.offsetHeight / 2) * 0.05;
  svg.style.transform = `translate(${-x}px, ${-y}px)`;
});
container.addEventListener('mouseleave', () => { svg.style.transform = 'translate(0,0)'; });

// 3) #done 锚点：直接展示完成态（便于截图/打印）
if (location.hash === '#done') document.documentElement.classList.add('done');
</script>
